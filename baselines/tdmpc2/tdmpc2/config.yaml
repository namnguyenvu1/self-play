defaults:
    - task: simple_adversary
    - override hydra/launcher: submitit_local

# # environment
# task: dog-run
obs: state
episodic: false

# evaluation
checkpoint: ???
eval_episodes: 25
eval_freq: 10000

# training
steps: 10_000_000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000
exp_name: default
data_dir: ???

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
wandb_project: ???
wandb_entity: ???
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: true
save_video: true
save_agent: true
seed: 1

# convenience
work_dir: ???
task_title: ???
multitask: ???
tasks: ???
obs_shape: ???
action_dim: ???
episode_length: ???
obs_shapes: ???
action_dims: ???
episode_lengths: ???
seed_steps: ???
bin_size: ???

# num_agents: 1 # Add this, 1 is a good default for single-agent
log_freq: 1000

# MPE Multi-Agent Configuration
mpe:
  task: simple_spread
#   num_agents: 3
#   episode_length: 25
  
  # Agent hyperparameters (may need tuning for MARL)
  lr: 3e-4
  horizon: 3
  num_pi_trajs: 12
  multistep: 3
  
  # Training
  num_train_frames: 1000000
  seed_steps: 5000
  batch_size: 256
  replay_buffer_size: 1000000
  
  # Evaluation
  eval_freq: 10000
  eval_episodes: 10
  
  # Logging
  log_freq: 1000
  save_freq: 50000

# Agent Assignment for Mixed-Algorithm Training
# Maps agent_id from the environment to an algorithm type ('tdmpc2' or 'ppo')
# agent_types:
#   adversary_0: tdmpc2
#   agent_0: ppo
#   agent_1: ppo

# PPO Hyperparameters
ppo:
  hidden_size: 64
  lr: 6e-4
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  epochs: 10
  rollout_steps: 2048 # PPO will update every this many steps
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  huber_delta: 10.0